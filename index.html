<!-- 1. 在 <head> 中引入 Chart.js 核心库与箱线图插件 -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<!-- 建议使用 cdnjs 的稳定版本，避免路径失效 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-chart-box-and-violin-plot/1.3.0/Chart.BoxPlot.min.js"></script>

<!-- 2. HTML 容器：必须确保父容器有明确的高度 -->
<div class="chart-container" style="position: relative; height:300px; width:100%;">
    <canvas id="boxplotChart"></canvas>
</div>

<!-- 3. 初始化脚本：放在 body 底部或 DOMContentLoaded 事件中 -->
<script>
document.addEventListener("DOMContentLoaded", function() {
    const boxplotCtx = document.getElementById('boxplotChart').getContext('2d');
    
    // 检查插件是否成功加载，避免因脚本加载失败导致静默空白
    if (typeof BoxPlotController === 'undefined') {
        console.error('BoxPlot 插件未加载，请检查 CDN 链接');
        return;
    }

    new Chart(boxplotCtx, {
        type: 'boxplot',
        data: {
            labels: ['Official Search', 'AI Agent'],
            datasets: [{
                label: 'Time (Seconds)',
                data: [
                    [80, 52, 243, 1200, 500, 300, 150, 120, 300, 20, 300, 600],
                    [120, 61, 180, 360, 3, 60, 5, 100, 150, 20, 180, 360]
                ],
                backgroundColor: ['rgba(149, 165, 166, 0.7)', 'rgba(44, 62, 80, 0.7)'],
                borderColor: ['#7f8c8d', '#1a252f'],
                borderWidth: 1.5,
                outlierColor: '#e74c3c',
                medianColor: '#ffffff'
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: false },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            let item = context.raw;
                            if (item && item.min !== undefined) {
                                return [
                                    `Max: ${item.max.toFixed(1)}s`,
                                    `Q3: ${item.q3.toFixed(1)}s`,
                                    `Median: ${item.median.toFixed(1)}s`,
                                    `Q1: ${item.q1.toFixed(1)}s`,
                                    `Min: ${item.min.toFixed(1)}s`
                                ];
                            }
                            return item;
                        }
                    }
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    title: { display: true, text: 'Time (Seconds)' },
                    grid: { color: '#e9ecef' }
                },
                x: {
                    grid: { display: false }
                }
            }
        }
    });
});
</script>
